<!DOCTYPE html>
  <html>
    <head>
      <title>Password Validator</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <style>
        form {
          width: 70%;
          margin: auto;
        }
        fieldset {
          background-color: lightgrey;
        }
        input {
          height: 20px;
          width: 180px;
        }
        #span {
          display: none;
          font-size: 80%;
        }
        #span:hover {
          cursor: pointer;
        }
        #conditions {
          display: none;
        }
        form p {
          color: red;
        }
        form p:nth-child(1) {
          margin-bottom: 4px;
        }
        form p:not(:nth-child(1)) {
          margin-top: 0px;
          margin-bottom: 5px;
        }
        input[type=submit] {
          height: 30px;
          width: 75px;
          border: none;
          background-color: rgb(137, 160, 181);
        }
        input[type=submit]:hover {
          color: white;
          cursor: pointer;
          background-color: rgb(66, 84, 99);
        }
      </style>
    </head>
    <body>
      <form autocomplete="on">
        <fieldset>
          <legend>Login</legend>
          <label for="username">Username:</label><br>
          <input type="text" name="username" id="username" required autocomplete="on"><br><br>
          <label for="password">Password:</label><br>
          <input type="password" name="password" id="password" oninput="showConditions(event)" required>
          <span id="span" onclick="showHide()">Show</span>
          <br><div id="conditions">
            <p><span>&cross;</span> Must contain a lowerrcase letter.</p>
            <p><span>&cross;</span> Must contain an uppercase letter.</p>
            <p><span>&cross;</span> Must contain a number.</p>
            <p><span>&cross;</span> Must contain a special character.</p>
            <p><span>&cross;</span> Must not be less than 8 characters.</p>
          </div><br>
          <input type="submit">
        </fieldset>
      </form>
      <!--<p id="reveal"></p>-->
      <script>
        const form = document.getElementsByTagName('form')[0];
        const password = document.getElementById('password');
        const span = document.getElementById('span');
        const conditions = document.getElementById('conditions');
        const allConditions = conditions.getElementsByTagName('p');
        function showConditions(event) {
          let inputValue = event.target.value;
          if (inputValue) {
            span.style.display = 'inline';
            conditions.style.display = 'block';
            if (inputValue.match(/[a-z]/)) { // /[A-Z]/.test(inputValue) is another way to write the condition
              allConditions[0].getElementsByTagName('span')[0].innerHTML = '&checkmark;';
              allConditions[0].style.color = 'green';
            } else {
              allConditions[0].getElementsByTagName('span')[0].innerHTML = '&cross;';
              allConditions[0].style.color = 'red';
            }
            if (inputValue.match(/[A-Z]/)) {
              allConditions[1].getElementsByTagName('span')[0].innerHTML = '&checkmark;';
              allConditions[1].style.color = 'green';
            } else {
              allConditions[1].getElementsByTagName('span')[0].innerHTML = '&cross;';
              allConditions[1].style.color = 'red';
            }
            if (inputValue.match(/[0-9]/)) {
              allConditions[2].getElementsByTagName('span')[0].innerHTML = '&checkmark;';
              allConditions[2].style.color = 'green';
            } else {
              allConditions[2].getElementsByTagName('span')[0].innerHTML = '&cross;';
              allConditions[2].style.color = 'red';
            }
            if (inputValue.match(/[!\-@#$^%&*+|?_=]/)) {
              allConditions[3].getElementsByTagName('span')[0].innerHTML = '&checkmark;';
              allConditions[3].style.color = 'green';
            } else {
              allConditions[3].getElementsByTagName('span')[0].innerHTML = '&cross;';
              allConditions[3].style.color = 'red';
            }
            if (inputValue.length >= 8) {
              allConditions[4].getElementsByTagName('span')[0].innerHTML = '&checkmark;';
              allConditions[4].style.color = 'green';
            } else {
              allConditions[4].getElementsByTagName('span')[0].innerHTML = '&cross;';
              allConditions[4].style.color = 'red';
            }
          } else {
            span.style.display = 'none';
            conditions.style.display = 'none';
          }
        //document.getElementById('reveal').innerHTML = password.type;
        }
        // Password revealer
        function showHide() {
          if (span.innerHTML == 'Hide') {
            password.type = 'password';
            span.innerHTML = 'Show';
          } else {
            password.type = 'text';
            span.innerHTML = 'Hide';
          }
        }
        // For the form to only submit if all password conditions are met
        form.addEventListener('submit', (e) => {
          if (allConditions[0].style.color == 'red' || allConditions[1].style.color == 'red' ||
            allConditions[2].style.color == 'red' || allConditions[3].style.color == 'red' ||
            allConditions[4].style.color == 'red') {
            e.preventDefault(); /* The 'e' is the submit event, not the click event, which is 
              what preventDefault() prevents*/
            alert('Please fulfil password conditions');
          } else if (password.type == 'text') {
            alert('Please hide your password');
            e.preventDefault();
            }
        });
      </script>
    </body>
  </html>
